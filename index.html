<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسجّل أفكار الأطروحة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --bg: #f8f9fe;
      --card: #ffffff;
      --text: #1e1b4b;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
      --ok: #16a34a;
      --type-addition: #6366f1;
      --type-review: #f59e0b;
      --type-article: #8b5cf6;
      --type-reference: #10b981;
      --type-note: #6b7280;
      --radius: 14px;
      --topbar-height: 64px;
      --sidebar-width: 300px;
      --shadow: 0 8px 30px rgba(79,70,229,.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .hidden { display: none !important; }
    .app-title, h1, h2, h3, h4, .stat-value { font-family: 'Cairo', sans-serif; }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: linear-gradient(145deg, #eef2ff, #ffffff);
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(99,102,241,.15);
      padding: 2rem;
      text-align: center;
    }

    .login-card h1 { margin: .25rem 0 .5rem; }
    .login-card p { color: var(--muted); margin-top: 0; }

    input, select, textarea, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: .6rem .75rem;
      width: 100%;
      background: #fff;
    }

    textarea { min-height: 90px; resize: vertical; }

    button {
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      border: none;
      transition: opacity .15s ease;
    }

    button:hover { opacity: .92; }
    .btn-secondary { background: #eef2ff; color: #3730a3; }
    .btn-danger { background: #fee2e2; color: #991b1b; }

    .alert { margin-top: .75rem; font-size: .9rem; color: #991b1b; min-height: 1.4rem; }

    .topbar {
      position: sticky;
      top: 0;
      height: var(--topbar-height);
      background: #fff;
      display: grid;
      grid-template-columns: auto minmax(240px, 420px) auto;
      gap: .75rem;
      align-items: center;
      padding: .6rem 1rem;
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .topbar .app-title { font-size: 1.15rem; margin: 0; }
    .search-wrap { position: relative; }
    .search-results {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      max-height: 330px;
      overflow: auto;
      z-index: 50;
    }

    .search-item {
      padding: .65rem .8rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
    }
    .search-item:last-child { border-bottom: 0; }
    .search-item:hover { background: var(--primary-soft); }
    .search-item small { display: block; color: var(--muted); }

    .layout {
      display: grid;
      grid-template-columns: var(--sidebar-width) 1fr;
      min-height: calc(100vh - var(--topbar-height));
    }

    .sidebar {
      background: #fff;
      border-left: 1px solid var(--border);
      padding: .9rem;
      overflow: auto;
    }

    .main {
      padding: 1rem;
      overflow: auto;
    }

    .tree-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .5rem;
      gap: .5rem;
    }

    .tree-list, .tree-list ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .tree-list ul { padding-right: .95rem; margin-top: .35rem; border-right: 1px dashed #e2e8f0; }

    .tree-node {
      display: flex;
      align-items: center;
      gap: .35rem;
      padding: .35rem;
      border-radius: 8px;
      margin-bottom: .2rem;
    }

    .tree-node.selected { background: #e0e7ff; }
    .tree-node:hover { background: #eef2ff; }

    .tree-title {
      flex: 1;
      cursor: pointer;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      width: auto;
      padding: 0 .2rem;
      font-size: 1rem;
      line-height: 1;
    }
    .icon-btn:hover { color: var(--primary); opacity: 1; }

    .badge {
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      padding: 0 .3rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: .75rem;
      margin-bottom: 1rem;
    }

    .stat-card {
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: .9rem;
      box-shadow: var(--shadow);
    }

    .stat-label { color: var(--muted); font-size: .85rem; }
    .stat-value { font-size: 1.5rem; font-weight: 800; }

    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .panel h3 { margin: 0 0 .6rem; }

    .idea-card {
      border: 1px solid var(--border);
      border-right: 4px solid var(--type-note);
      border-radius: 12px;
      background: #fff;
      padding: .8rem;
      margin-bottom: .65rem;
    }

    .idea-card.done { opacity: .6; }
    .idea-meta { display: flex; gap: .35rem; flex-wrap: wrap; margin-bottom: .4rem; font-size: .85rem; color: var(--muted); }
    .tag {
      border-radius: 999px;
      padding: .15rem .5rem;
      color: #fff;
      font-size: .75rem;
    }

    .idea-content { white-space: pre-wrap; margin: .4rem 0; cursor: pointer; }
    .idea-path { color: var(--muted); font-size: .82rem; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: .55rem;
      margin-bottom: .8rem;
    }

    .quick-add {
      display: grid;
      grid-template-columns: 1fr 140px 140px auto;
      gap: .5rem;
      align-items: center;
      margin-top: .9rem;
    }

    .muted { color: var(--muted); }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { max-height: 280px; border-left: 0; border-bottom: 1px solid var(--border); }
      .topbar { grid-template-columns: 1fr; height: auto; }
      .quick-add { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div style="font-size: 2rem;">🎓</div>
      <h1>مسجّل الأطروحة</h1>
      <p>أطروحتك، منظّمة ومحمية</p>
      <form id="loginForm">
        <input id="passwordInput" type="password" placeholder="كلمة المرور" autocomplete="current-password" required />
        <button style="margin-top:.7rem" type="submit">دخول إلى مساحتي</button>
      </form>
      <div id="loginAlert" class="alert"></div>
    </div>
  </section>

  <section id="appScreen" class="hidden">
    <header class="topbar">
      <h2 class="app-title">🎓 مسجّل أفكار الأطروحة</h2>
      <div class="search-wrap">
        <input id="searchInput" placeholder="ابحث في العقد والأفكار..." />
        <div id="searchResults" class="search-results hidden"></div>
      </div>
      <button id="logoutBtn" style="width:auto;padding:.5rem 1rem">تسجيل خروج</button>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="tree-toolbar">
          <strong>🌳 هيكل الأطروحة</strong>
          <button id="addChapterBtn" class="btn-secondary" style="width:auto;padding:.4rem .7rem">+ فصل</button>
        </div>
        <ul id="treeRoot" class="tree-list"></ul>
      </aside>

      <main class="main">
        <div id="mainContent"></div>
      </main>
    </div>
  </section>

  <script>
    const state = {
      csrfToken: null,
      tree: [],
      nodes: [],
      selectedNodeId: null,
      collapsed: new Set(),
      ideas: [],
      activeFilters: { type: '', priority: '', status: 'all' },
      searchTimer: null,
    };

    const ideaTypeMeta = {
      addition: { label: 'إضافة', color: 'var(--type-addition)' },
      review: { label: 'مراجعة', color: 'var(--type-review)' },
      article: { label: 'مقال', color: 'var(--type-article)' },
      reference: { label: 'مرجع', color: 'var(--type-reference)' },
      note: { label: 'ملاحظة', color: 'var(--type-note)' },
    };

    const mainContent = document.getElementById('mainContent');
    const treeRoot = document.getElementById('treeRoot');

    function escapeHtml(v) {
      return String(v)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    async function api(action, { method = 'GET', data = null, query = {} } = {}) {
      const qs = new URLSearchParams({ action, ...query });
      const init = { method, credentials: 'same-origin', headers: {} };

      if (state.csrfToken && method !== 'GET') {
        init.headers['X-CSRF-Token'] = state.csrfToken;
      }

      if (data) {
        init.headers['Content-Type'] = 'application/json';
        init.body = JSON.stringify(data);
      }

      const res = await fetch(`api.php?${qs.toString()}`, init);
      const payload = await res.json().catch(() => ({}));
      if (!res.ok || payload.ok === false) {
        const err = new Error(payload.error || 'REQUEST_FAILED');
        err.code = payload.error || 'REQUEST_FAILED';
        throw err;
      }
      if (payload.csrf_token) {
        state.csrfToken = payload.csrf_token;
      }
      return payload;
    }

    function showLogin() {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
      mainContent.innerHTML = '';
      treeRoot.innerHTML = '';
    }

    function showApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
    }

    async function initializeApp() {
      showApp();
      await Promise.all([loadTree(), renderDashboard()]);
    }

    function findNodeById(id, source = state.nodes) {
      return source.find((n) => Number(n.id) === Number(id)) || null;
    }

    function aggregateCounts(treeNode) {
      let total = treeNode.pending_count || 0;
      if (treeNode.children?.length) {
        for (const child of treeNode.children) {
          total += aggregateCounts(child);
        }
      }
      treeNode.aggregate_pending = total;
      return total;
    }

    function renderTree() {
      treeRoot.innerHTML = '';
      for (const root of state.tree) {
        aggregateCounts(root);
      }
      state.tree.forEach((node) => treeRoot.appendChild(buildTreeNode(node)));
    }

    function buildTreeNode(node) {
      const li = document.createElement('li');
      const row = document.createElement('div');
      row.className = 'tree-node' + (state.selectedNodeId === node.id ? ' selected' : '');

      const hasChildren = Array.isArray(node.children) && node.children.length > 0;
      const collapsed = state.collapsed.has(node.id);

      const toggle = document.createElement('button');
      toggle.className = 'icon-btn';
      toggle.textContent = hasChildren ? (collapsed ? '▶' : '▼') : '•';
      toggle.disabled = !hasChildren;
      toggle.onclick = () => {
        if (!hasChildren) return;
        if (state.collapsed.has(node.id)) state.collapsed.delete(node.id);
        else state.collapsed.add(node.id);
        renderTree();
      };

      const title = document.createElement('span');
      title.className = 'tree-title';
      title.textContent = node.title;
      title.onclick = () => selectNode(node.id);
      title.ondblclick = () => renameNode(node);

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = node.aggregate_pending || 0;

      const addBtn = document.createElement('button');
      addBtn.className = 'icon-btn';
      addBtn.title = 'إضافة ابن';
      addBtn.textContent = '+';
      addBtn.onclick = () => addNode(node.id);

      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn';
      upBtn.title = 'تحريك لأعلى';
      upBtn.textContent = '↑';
      upBtn.onclick = () => reorderNode(node.id, 'up');

      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn';
      downBtn.title = 'تحريك لأسفل';
      downBtn.textContent = '↓';
      downBtn.onclick = () => reorderNode(node.id, 'down');

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn';
      delBtn.title = 'حذف';
      delBtn.textContent = '🗑';
      delBtn.onclick = () => deleteNode(node.id);

      row.append(toggle, title, badge, addBtn, upBtn, downBtn, delBtn);
      li.appendChild(row);

      if (hasChildren && !collapsed) {
        const ul = document.createElement('ul');
        node.children.forEach((child) => ul.appendChild(buildTreeNode(child)));
        li.appendChild(ul);
      }

      return li;
    }

    async function loadTree() {
      const data = await api('get_tree');
      state.tree = data.tree || [];
      state.nodes = data.nodes || [];
      renderTree();
      if (state.selectedNodeId) {
        await selectNode(state.selectedNodeId, false);
      }
    }

    async function addNode(parentId = null) {
      const parent = parentId ? findNodeById(parentId) : null;
      const title = prompt(parent ? `عنوان ${parent.level >= 4 ? 'العنصر' : 'العقدة الجديدة'}:` : 'عنوان الفصل الجديد:');
      if (!title || !title.trim()) return;
      await api('add_node', { method: 'POST', data: { parent_id: parentId, title: title.trim() } });
      await loadTree();
    }

    async function renameNode(node) {
      const title = prompt('تعديل العنوان:', node.title);
      if (!title || title.trim() === node.title) return;
      await api('edit_node', { method: 'POST', data: { node_id: node.id, title: title.trim() } });
      await loadTree();
      if (state.selectedNodeId === node.id) await selectNode(node.id);
    }

    async function deleteNode(nodeId) {
      if (!confirm('سيتم حذف هذه العقدة وكل أفكارها والأبناء. هل أنت متأكد؟')) return;
      await api('delete_node', { method: 'POST', data: { node_id: nodeId } });
      if (state.selectedNodeId === nodeId) state.selectedNodeId = null;
      await Promise.all([loadTree(), renderDashboard()]);
    }

    async function reorderNode(nodeId, direction) {
      await api('reorder_node', { method: 'POST', data: { node_id: nodeId, direction } });
      await loadTree();
    }

    function nodePath(nodeId) {
      const byId = new Map(state.nodes.map((n) => [n.id, n]));
      const parts = [];
      let current = byId.get(nodeId);
      while (current) {
        parts.unshift(current.title);
        current = current.parent_id ? byId.get(Number(current.parent_id)) : null;
      }
      return parts.join(' › ');
    }

    function filterIdeas(ideas) {
      return ideas.filter((idea) => {
        if (state.activeFilters.type && idea.idea_type !== state.activeFilters.type) return false;
        if (state.activeFilters.priority && String(idea.priority) !== state.activeFilters.priority) return false;
        if (state.activeFilters.status === 'done' && !idea.is_done) return false;
        if (state.activeFilters.status === 'pending' && idea.is_done) return false;
        return true;
      });
    }

    function renderIdeaCard(idea) {
      const typeInfo = ideaTypeMeta[idea.idea_type] || ideaTypeMeta.note;
      const priorityMap = { 1: '🔴 عاجل', 2: '🟡 عادي', 3: '⚪ لاحقاً' };
      const checked = idea.is_done ? 'checked' : '';

      return `
        <article class="idea-card ${idea.is_done ? 'done' : ''}" style="border-right-color:${typeInfo.color}" data-idea-id="${idea.id}">
          <div class="idea-meta">
            <span class="tag" style="background:${typeInfo.color}">${typeInfo.label}</span>
            <span>${priorityMap[idea.priority] || '🟡 عادي'}</span>
            <label><input class="toggle-idea" type="checkbox" ${checked}/> مكتملة</label>
            <button class="icon-btn edit-idea" title="تعديل">✏️</button>
            <button class="icon-btn delete-idea" title="حذف">🗑</button>
          </div>
          <div class="idea-content">${escapeHtml(idea.content)}</div>
          <div class="idea-path">📍 ${escapeHtml(idea.path || nodePath(idea.node_id) || '')}</div>
        </article>
      `;
    }

    async function selectNode(nodeId, refreshIdeas = true) {
      state.selectedNodeId = Number(nodeId);
      renderTree();
      if (refreshIdeas) {
        const data = await api('get_ideas', { query: { node_id: state.selectedNodeId, aggregate: 'true' } });
        state.ideas = data.ideas || [];
      }
      renderNodeView();
    }

    function renderNodeView() {
      const node = findNodeById(state.selectedNodeId);
      if (!node) {
        mainContent.innerHTML = '<div class="panel muted">اختر عقدة من الشجرة لعرض أفكارها.</div>';
        return;
      }

      const filteredIdeas = filterIdeas(state.ideas);
      const path = nodePath(node.id);

      mainContent.innerHTML = `
        <section class="panel">
          <h3>${escapeHtml(node.title)}</h3>
          <p class="muted">${escapeHtml(path)}</p>
          <div class="controls">
            <select id="filterType">
              <option value="">كل الأنواع</option>
              <option value="addition">إضافة</option>
              <option value="review">مراجعة</option>
              <option value="article">مقال</option>
              <option value="reference">مرجع</option>
              <option value="note">ملاحظة</option>
            </select>
            <select id="filterPriority">
              <option value="">كل الأولويات</option>
              <option value="1">عاجل</option>
              <option value="2">عادي</option>
              <option value="3">لاحقاً</option>
            </select>
            <select id="filterStatus">
              <option value="all">كل الحالات</option>
              <option value="pending">غير مكتمل</option>
              <option value="done">مكتمل</option>
            </select>
          </div>
          <div id="ideasContainer">
            ${filteredIdeas.length ? filteredIdeas.map(renderIdeaCard).join('') : '<p class="muted">لا توجد أفكار بعد.</p>'}
          </div>

          <form id="addIdeaForm" class="quick-add">
            <textarea id="ideaContent" placeholder="اكتب فكرتك هنا..." required></textarea>
            <select id="ideaType">
              <option value="note">ملاحظة</option>
              <option value="addition">إضافة</option>
              <option value="review">مراجعة</option>
              <option value="article">مقال</option>
              <option value="reference">مرجع</option>
            </select>
            <select id="ideaPriority">
              <option value="2">🟡 عادي</option>
              <option value="1">🔴 عاجل</option>
              <option value="3">⚪ لاحقاً</option>
            </select>
            <button type="submit">إضافة فكرة</button>
          </form>
        </section>
      `;

      document.getElementById('filterType').value = state.activeFilters.type;
      document.getElementById('filterPriority').value = state.activeFilters.priority;
      document.getElementById('filterStatus').value = state.activeFilters.status;

      document.getElementById('filterType').onchange = (e) => { state.activeFilters.type = e.target.value; renderNodeView(); };
      document.getElementById('filterPriority').onchange = (e) => { state.activeFilters.priority = e.target.value; renderNodeView(); };
      document.getElementById('filterStatus').onchange = (e) => { state.activeFilters.status = e.target.value; renderNodeView(); };

      document.getElementById('addIdeaForm').onsubmit = async (e) => {
        e.preventDefault();
        const content = document.getElementById('ideaContent').value.trim();
        if (!content) return;
        await api('add_idea', {
          method: 'POST',
          data: {
            node_id: state.selectedNodeId,
            content,
            idea_type: document.getElementById('ideaType').value,
            priority: Number(document.getElementById('ideaPriority').value),
          },
        });
        state.activeFilters.status = 'all';
        await Promise.all([selectNode(state.selectedNodeId), loadTree(), renderDashboard()]);
      };

      document.querySelectorAll('.idea-card').forEach((card) => {
        const ideaId = Number(card.dataset.ideaId);
        const idea = state.ideas.find((i) => i.id === ideaId);
        if (!idea) return;

        card.querySelector('.toggle-idea').onchange = async (e) => {
          await api('toggle_idea', { method: 'POST', data: { idea_id: ideaId, is_done: e.target.checked } });
          await Promise.all([selectNode(state.selectedNodeId), loadTree(), renderDashboard()]);
        };

        card.querySelector('.delete-idea').onclick = async () => {
          if (!confirm('حذف الفكرة؟')) return;
          await api('delete_idea', { method: 'POST', data: { idea_id: ideaId } });
          await Promise.all([selectNode(state.selectedNodeId), loadTree(), renderDashboard()]);
        };

        const edit = async () => {
          const content = prompt('تعديل الفكرة:', idea.content);
          if (!content || !content.trim()) return;
          await api('edit_idea', {
            method: 'POST',
            data: {
              idea_id: ideaId,
              content: content.trim(),
              idea_type: idea.idea_type,
              priority: idea.priority,
            },
          });
          await Promise.all([selectNode(state.selectedNodeId), loadTree(), renderDashboard()]);
        };

        card.querySelector('.edit-idea').onclick = edit;
        card.querySelector('.idea-content').ondblclick = edit;
      });
    }

    async function renderDashboard() {
      try {
        const data = await api('dashboard');
        const s = data.stats;
        const completion = s.ideas_total ? Math.round((s.ideas_done / s.ideas_total) * 100) : 0;

        if (state.selectedNodeId) {
          return;
        }

        mainContent.innerHTML = `
          <section class="cards">
            <article class="stat-card"><div class="stat-label">إجمالي الفصول</div><div class="stat-value">${s.chapters}</div></article>
            <article class="stat-card"><div class="stat-label">إجمالي الأفكار</div><div class="stat-value">${s.ideas_total}</div></article>
            <article class="stat-card"><div class="stat-label">نسبة الإنجاز</div><div class="stat-value">${completion}%</div></article>
            <article class="stat-card"><div class="stat-label">الأفكار العاجلة</div><div class="stat-value">${s.ideas_urgent}</div></article>
          </section>

          <section class="panel">
            <h3>آخر 5 أفكار</h3>
            ${data.latest_ideas.length ? data.latest_ideas.map((idea) =>
              `<div class="idea-card" data-go-node="${idea.node_id}"><div>${escapeHtml(idea.content.slice(0, 180))}</div><div class="idea-path">${escapeHtml(idea.path || '')}</div></div>`
            ).join('') : '<p class="muted">لا توجد أفكار حتى الآن.</p>'}
          </section>

          <section class="panel">
            <h3>الأفكار العاجلة</h3>
            ${data.urgent_ideas.length ? data.urgent_ideas.map((idea) =>
              `<div class="idea-card" data-go-node="${idea.node_id}"><div>${escapeHtml(idea.content.slice(0, 180))}</div><div class="idea-path">${escapeHtml(idea.path || '')}</div></div>`
            ).join('') : '<p class="muted">لا توجد أفكار عاجلة.</p>'}
          </section>
        `;

        mainContent.querySelectorAll('[data-go-node]').forEach((el) => {
          el.style.cursor = 'pointer';
          el.onclick = () => selectNode(Number(el.dataset.goNode));
        });
      } catch (err) {
        if (err.code === 'UNAUTHORIZED') {
          state.csrfToken = null;
          showLogin();
        } else {
          mainContent.innerHTML = '<div class="panel">تعذر تحميل لوحة الملخص.</div>';
        }
      }
    }

    async function search(query) {
      const container = document.getElementById('searchResults');
      if (!query.trim()) {
        container.classList.add('hidden');
        container.innerHTML = '';
        return;
      }

      const data = await api('search', { query: { q: query.trim() } });
      const items = data.results || [];
      if (!items.length) {
        container.innerHTML = '<div class="search-item muted">لا توجد نتائج</div>';
        container.classList.remove('hidden');
        return;
      }

      container.innerHTML = items.map((item) => `
        <div class="search-item" data-node-id="${item.node_id}">
          <strong>${escapeHtml(item.snippet)}</strong>
          <small>${escapeHtml(item.path || '')}</small>
        </div>
      `).join('');
      container.classList.remove('hidden');

      container.querySelectorAll('.search-item').forEach((el) => {
        el.onclick = async () => {
          container.classList.add('hidden');
          state.selectedNodeId = Number(el.dataset.nodeId);
          await selectNode(state.selectedNodeId);
        };
      });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById('loginAlert');
      alertBox.textContent = '';
      try {
        const password = document.getElementById('passwordInput').value;
        await api('login', { method: 'POST', data: { password } });
        document.getElementById('passwordInput').value = '';
        await initializeApp();
      } catch {
        alertBox.textContent = 'كلمة المرور غير صحيحة.';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      try { await api('logout', { method: 'POST' }); } catch {}
      state.csrfToken = null;
      state.selectedNodeId = null;
      state.ideas = [];
      showLogin();
    });

    document.getElementById('addChapterBtn').onclick = () => addNode(null);

    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(state.searchTimer);
      state.searchTimer = setTimeout(() => search(e.target.value), 250);
    });

    document.addEventListener('click', (e) => {
      const searchWrap = document.querySelector('.search-wrap');
      if (!searchWrap.contains(e.target)) {
        document.getElementById('searchResults').classList.add('hidden');
      }
    });

    (async () => {
      try {
        await initializeApp();
      } catch (err) {
        if (err.code === 'UNAUTHORIZED') {
          showLogin();
        } else {
          showLogin();
          document.getElementById('loginAlert').textContent = 'تعذر الاتصال بالخادم.';
        }
      }
    })();
  </script>
</body>
</html>
